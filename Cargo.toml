[workspace]
members = ["crates/*"]
exclude = ["generated", "demos/generated", "fuzz", "crates/assura-parser/fuzz", "crates/assura-driver"]
resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/assura-lang/assura"
homepage = "https://github.com/assura-lang/assura"
keywords = ["compiler", "contracts", "verification", "smt", "formal-methods"]
categories = ["compilers", "development-tools"]

[profile.dist]
inherits = "release"
lto = "thin"

# crates.io z3-sys 0.13.1 requires zip ^8.2 (RUSTSEC-2026-0367/0368/0369).
# third_party/z3-sys is that release with zip 9. Remove this when crates.io
# z3-sys allows zip >= 9.
[patch.crates-io]
z3-sys = { path = "third_party/z3-sys" }
