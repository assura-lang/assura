version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    # Keep open PRs rebased when main moves so strict status checks +
    # auto-merge can land without manual update-branch thrash.
    # Backup when Dependabot is slow: .github/workflows/rebase-dependabot.yml
    rebase-strategy: auto
    # Groups collapse many lockfile PRs into one; limit still caps majors
    # and any ungrouped updates that remain solo.
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    ignore:
      # Architectural pins -- see AGENTS.md "Crate Versioning (CRITICAL)"
      # ariadne 0.6 is current (Report::build takes (kind, span)); 0.7+
      # would be a new API break. Allow 0.6.x patches through.
      - dependency-name: ariadne
        versions: [">=0.7"]
      # z3 0.20 is current (no lifetime params, no &ctx first arg);
      # 0.21+ is a new major. Allow 0.20.x patches through.
      - dependency-name: z3
        versions: [">=0.21"]
      # cvc5 0.4 is current (TermManager factory, Sort not Copy).
      # 0.5 binds wrapper lifetimes to the arena (cvc5-rs#62).
      # Allow 0.4.x patches through. Closed #1533.
      - dependency-name: cvc5
        versions: [">=0.5"]
    groups:
      # tonic, prost, and tonic-build must be upgraded together;
      # individual PRs always fail because of version coupling.
      grpc-stack:
        patterns:
          - "tonic"
          - "tonic-*"
          - "prost"
          - "prost-*"
      # One PR for all other minor/patch crates so concurrent Cargo.lock
      # PRs do not repeatedly push each other BEHIND under strict checks.
      # Majors stay ungrouped for separate review (e.g. rmcp 2 -> 3).
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: "/editors/vscode"
    schedule:
      interval: weekly
    rebase-strategy: auto
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    groups:
      vscode-npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: "/editors/tree-sitter-assura"
    schedule:
      interval: weekly
    rebase-strategy: auto
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    groups:
      tree-sitter-npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    rebase-strategy: auto
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "ci"
    groups:
      # upload-artifact and download-artifact must move together.
      artifact-actions:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
      # init/analyze/upload-sarif must share one version (mixed pins fail CodeQL).
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Remaining actions in one PR (stale, checkout, cache, etc.).
      github-actions:
        patterns:
          - "*"
