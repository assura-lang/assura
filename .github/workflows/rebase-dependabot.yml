name: Rebase Dependabot

# After a merge, strict required checks leave other Dependabot PRs BEHIND.
# Dependabot rebase-strategy: auto is slow, so auto-merge sits armed forever.
# Comment @dependabot rebase on those PRs when main moves (and hourly backup).

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # GITHUB_TOKEN comments as github-actions[bot]. Dependabot replies
      # "only users with push access can use that command" (#1508 first run).
      # Use the same App token as auto-approve (contents + pull-requests).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.AUTO_APPROVE_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_APPROVE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Rebase Dependabot PRs that are behind main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          nums=$(gh pr list --repo "${REPO}" --author "app/dependabot" --state open \
            --json number,mergeStateStatus \
            --jq '[.[] | select(.mergeStateStatus == "BEHIND") | .number] | .[]')
          if [ -z "${nums}" ]; then
            echo "No Dependabot PRs behind main."
            exit 0
          fi
          for n in ${nums}; do
            echo "Requesting rebase of #${n}"
            gh pr comment "${n}" --repo "${REPO}" --body "@dependabot rebase"
          done
