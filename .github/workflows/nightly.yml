name: Nightly

on:
  schedule:
    - cron: "0 4 * * *"   # 4:00 UTC daily
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

# Daily CI (ci.yml schedule 0 3 * * *) already runs fmt, clippy, workspace
# test, cargo-package, CVC5, demo check/codegen, and no-z3. Nightly keeps
# only coverage CI still skips: examples/**/*.assura.
jobs:
  examples:
    name: E2E check all examples
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: target/ci-nightly
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-nightly

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y protobuf-compiler libz3-dev z3
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Set Linux Z3 paths
        if: runner.os == 'Linux'
        run: |
          {
            echo "Z3_SYS_Z3_HEADER=/usr/include/z3.h"
            echo "CPATH=/usr/include"
            echo "LIBRARY_PATH=/usr/lib/x86_64-linux-gnu"
          } >> "$GITHUB_ENV"

      - name: Build compiler
        run: cargo build --locked --bin assura

      - name: E2E check all examples
        run: |
          failed=0
          for example in $(find examples -name '*.assura' | sort); do
            echo "=== Checking $example ==="
            if ! cargo run --bin assura -- check "$example"; then
              echo "FAIL: $example"
              failed=1
            fi
          done
          exit $failed
