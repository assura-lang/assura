name: Auto-approve

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    # Skip PRs authored by github-actions[bot] (self-approve deadlock).
    # Skip release-please PRs for auto-merge (label check below); approve is still fine
    # when author is the App bot (different identity from GITHUB_TOKEN).
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      (github.actor == 'SebTardif' ||
       github.event.pull_request.user.login == 'dependabot[bot]' ||
       endsWith(github.event.pull_request.user.login, '[bot]'))
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # App token first: used for both approve and auto-merge.
      # Prefer App over GITHUB_TOKEN for approve so:
      # 1) fork PRs work (GITHUB_TOKEN cannot review cross-fork PRs),
      # 2) require_last_push_approval is satisfied when a human maintainer
      #    was the last pusher (App is a different identity).
      # Dependabot `pull_request` runs do not receive repository secrets:
      # create-github-app-token may fail; continue-on-error + GITHUB_TOKEN
      # fallback keeps same-repo / Dependabot paths working.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        continue-on-error: true
        with:
          client-id: ${{ vars.AUTO_APPROVE_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_APPROVE_PRIVATE_KEY }}
          # Least privilege for approve + auto-merge (zizmor github-app audit).
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Approve PR
        if: github.event.pull_request.user.login != 'github-actions[bot]'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr review --approve "${PR_NUMBER}" --repo "${REPO}" \
            || echo "Approve failed (fork token limits or already approved); continuing."

      # Never auto-merge release-please PRs (maintainer controls release cadence).
      - name: Enable auto-merge
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
        env:
          # Prefer App token; fall back to GITHUB_TOKEN when App mint failed
          # (Dependabot secret isolation or missing AUTO_APPROVE_PRIVATE_KEY).
          # Use env (not ${{ }} inside run:) so zizmor template-injection is clean.
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "${APP_TOKEN}" ]; then
            echo "App token unavailable; using GITHUB_TOKEN for auto-merge (post-merge push workflows may be suppressed)."
          fi
          gh pr merge --auto --squash "${PR_NUMBER}" --repo "${REPO}" \
            || echo "Could not enable auto-merge (common when PR modifies .github/workflows/* and the App lacks workflows permission, or checks not yet green). PR was approved; manual merge may be needed."