name: Setup Rust CI
description: Shared setup for Rust CI jobs (toolchain, cache, system deps, disk check)

inputs:
  shared-key:
    description: Swatinem/rust-cache shared-key (e.g. ci-clippy)
    required: true
  install-system-deps:
    description: Install protobuf, Z3, and OpenSSL system libraries (Linux)
    default: 'true'
  toolchain-components:
    description: Extra rustup components (e.g. "clippy, rustfmt")
    default: ''
  toolchain:
    description: Rust toolchain name (stable, or a pinned release such as 1.87.0)
    default: stable

runs:
  using: composite
  steps:
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.toolchain-components }}

    - name: Cache dependencies
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch' }}

    # build.rs keeps extracted Z3 under $HOME/.cache/z3-sys (see
    # third_party/z3-sys/src/z3_cache.rs). rust-cache does not cover that
    # directory, and OUT_DIR is discarded when build.rs changes.
    # Key version matches GH_RELEASE_VERSION in third_party/z3-sys/build.rs.
    - name: Cache Z3 static library
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.cache/z3-sys
        key: z3-sys-5.1.0-${{ runner.os }}-${{ runner.arch }}

    - name: Install system dependencies (Linux)
      if: ${{ runner.os == 'Linux' && inputs.install-system-deps == 'true' }}
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libz3-dev z3 libssl-dev ripgrep
      env:
        DEBIAN_FRONTEND: noninteractive

    - name: Set Linux Z3 paths
      if: ${{ runner.os == 'Linux' && inputs.install-system-deps == 'true' }}
      shell: bash
      run: |
        echo "Z3_SYS_Z3_HEADER=/usr/include/z3.h" >> "$GITHUB_ENV"
        echo "CPATH=/usr/include" >> "$GITHUB_ENV"
        echo "LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"

    - name: Check disk space
      shell: bash
      run: |
        avail=$(df -k / | awk 'NR==2{print $4}')
        echo "Available disk: $(df -h / | awk 'NR==2{print $4}')"
        if [ "$avail" -lt 20971520 ]; then
          echo "::warning::Less than 20GB free disk space. Compilation may fail with SIGKILL."
        fi
        if [ "$avail" -lt 5242880 ]; then
          echo "::error::Less than 5GB free disk space. Aborting to prevent SIGKILL during compilation."
          exit 1
        fi
