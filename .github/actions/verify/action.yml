name: 'Assura Verify'
description: 'Verify Assura contracts in your CI pipeline'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  files:
    description: 'Glob pattern for .assura files to verify'
    required: false
    default: '**/*.assura'
  layer:
    description: 'Verification layer (0=structural, 1=SMT, 2=full)'
    required: false
    default: '1'
  fail-on-warning:
    description: 'Fail the action on warnings (not just errors)'
    required: false
    default: 'false'
  json-output:
    description: 'Output results as JSON'
    required: false
    default: 'false'
  version:
    description: 'Assura version to install (crates.io version, or latest)'
    required: false
    default: 'latest'
  allow-empty:
    description: 'Succeed when the files glob matches nothing'
    required: false
    default: 'false'

outputs:
  total-contracts:
    description: 'Total number of contracts checked'
    value: ${{ steps.verify.outputs.total-contracts }}
  verified:
    description: 'Number of verified contracts'
    value: ${{ steps.verify.outputs.verified }}
  errors:
    description: 'Number of errors found'
    value: ${{ steps.verify.outputs.errors }}
  result:
    description: 'JSON result (when json-output is true)'
    value: ${{ steps.verify.outputs.result }}

runs:
  using: 'composite'
  steps:
    - name: Install Assura
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: bash "${{ github.action_path }}/verify.sh" --step install

    - name: Install Z3
      shell: bash
      run: |
        if ! command -v z3 &> /dev/null; then
          if [ "$(uname)" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libz3-dev
          elif [ "$(uname)" = "Darwin" ]; then
            brew install z3
          fi
        fi

    - name: Run verification
      id: verify
      shell: bash
      env:
        FILES: ${{ inputs.files }}
        LAYER: ${{ inputs.layer }}
        JSON_OUTPUT: ${{ inputs.json-output }}
        FAIL_ON_WARNING: ${{ inputs.fail-on-warning }}
        ALLOW_EMPTY: ${{ inputs.allow-empty }}
      run: bash "${{ github.action_path }}/verify.sh" --step run